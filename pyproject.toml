[project]
name = "backyard-data"
version = "0.1.0"
description = "A data pipeline for exploring Seattle ADU building permits"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "seaborn>=0.13.2",
]

[tool.ruff]
extend-exclude = ["notebooks/"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.9",
]
